			alert("Uma das informações necessárias está vazia. Verifique os campos.");
			return;
		}

		fetch("/usuarios/autenticar", {
			method: "POST",
			headers: {

			},

						sessionStorage.NOME_USUARIO = json.nome_usuario;
						sessionStorage.ID_USUARIO = json.id_usuario;
						sessionStorage.ID_EMPRESA = json.fk_empresa; 

						alert("Login realizado com sucesso. Seja bem vindo(a)!");

							}

					});
				} else {
					throw "Houve um erro ao tentar realizar o login!";
