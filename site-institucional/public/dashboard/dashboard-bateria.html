<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Icons -->
    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard-bateria.css">
    <link rel="stylesheet" href="../css/menu.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />

    <script src="../js/menu.js"></script>
    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>

    <title>Dashboard</title>
</head>

<body onload="validarSessao()">

    <div id="menu_hamburger"></div>
    <script>
        fetch("../includes/menu.html")
            .then(resposta => resposta.text())
            .then(dados => {
                document.getElementById("menu_hamburger").innerHTML = dados;
            });
    </script>

    <div class="titulos">
        <div class="titulo-pag">
            <img src="../assets/imgs/imagemtitulo.svg" alt="imagemTitulo">
            <h1 id="nomeBateria"></h1>
        </div>
        <h2 class="fazenda-grupo" id="nome_fazenda"></h2>
    </div>


    <div class="campos">

        <div class="campo-silo">
            <div id="boxNiveis">
                <div id="boxNiveisSilos">
                    <div id="boxNiveisBateria">
                        <div id="nivelTotalBateria">
                            <div id="titNivelTotalBat">Nível Total da Bateria</div>
                            <div id="dadoNivelTotalBat"></div>
                        </div>
                        <div id="nivelMediaBateria">
                            <div id="titNivelMedioBat">Nível Médio da Bateria</div>
                            <div id="dadoNivelMedioBat"></div>
                        </div>

                    </div>
                    <div id="graficosMaiorMenor">
                        <p id="tituloMaiorMenorNivel">MAIOR E MENOR NÍVEL DOS SILOS</p>
                        <div
                            style="display: flex; flex-direction: row; justify-content: space-evenly; width: 100%; background: transparent">
                            <div class="volumeSilo">
                                <p id="siloMaximo">Silo 4</p>
                                <div class="SilosNivel" id="siloMaior">

                                </div>
                                <div class="porcentagem" id="maiorSilo">31<span>%</span></div>
                            </div>
                            <div class="volumeSilo">
                                <p id="siloMinimo">Silo 7</p>
                                <div class="SilosNivel" id="siloMenor">
                                    <div id="vermelhoMenor"></div>
                                </div>
                                <div class="porcentagem" id="menorSilo">7<span>%</span></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="situacaoNivelCadaSilo">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>

        <div id="parte2">
            <div class="campo-grafico">
                <canvas id="myChart2"></canvas>
            </div>
            <div id="boxSilosIndividuais">

                <div id="botoesSilosIndividuais">
                    <div class="boxBotao" id="boxBotao">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>

    const parametros = new URLSearchParams(window.location.search);

    const id_fazenda = parametros.get("id_fazenda")
    const id_bateria = parametros.get("id_bateria_silo");
    sessionStorage.ID_FAZENDA = id_fazenda;


    console.log(`ID DA FAZENDA: `, id_fazenda)
    console.log(`ID DA BATERIA: `, id_bateria);



    fetch(`/dashBateria/selectInfoBateria/${id_bateria}`, { cache: 'no-store' })
        .then(function (response) {
            if (response.ok) {

                response.json()
                    .then(function (resposta) {
                        console.log(resposta[0])
                        nomeBateria.innerHTML = `BATERIA: ${resposta[0].nome}`

                    })

            } else {
                console.log("Nenhum dado encontrado")
            }

        })
        .catch(function (error) {
            console.error("Erro na obtenção de dados")
        })



    fetch(`/dashBateria/selectInfoFazenda/${id_fazenda}`, { cache: 'no-store' })
        .then(function (response) {
            if (response.ok) {
                response.json()
                    .then(function (resposta) {

                        nome_fazenda.innerHTML = `Fazenda: ${resposta[0].nome}`


                    })

            } else {
                console.log("Nenhum dado encontrado PARA FAZENDA")
            }
        })
        .catch(function (error) {
            console.error("Erro na obtenção de dados")
        })

    function obterDadosVolumeTotal() {

        fetch(`/dashBateria/selectVolumeTotal/${id_bateria}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        dadoNivelTotalBat.innerHTML = `${resposta[0].nivelTotal}m³`


                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }


    function obterDadosVolumeMaior() {


        fetch(`/dashBateria/selectMaiorNivel/${id_bateria}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        siloMaximo.innerHTML = `Silo ${resposta[0].modelo}`
                        let porcentagem = (resposta[0].preenchimento) / (resposta[0].total)
                        siloMaior.innerHTML = `<div id="vermelhoMaior" style="height:${porcentagem * 100}%;"></div>`
                        maiorSilo.innerHTML = `${porcentagem.toFixed(2) * 100}%`

                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }



    function obterDadosVolumeMenor() {

        fetch(`/dashBateria/selectMenorNivel/${id_bateria}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        siloMinimo.innerHTML = `Silo ${resposta[0].modelo}`
                        let porcentagem = (resposta[0].preenchimento) / (resposta[0].total)
                        siloMenor.innerHTML = `<div id="vermelhoMaior" style="height:${porcentagem * 100}%;"></div>`
                        menorSilo.innerHTML = `${porcentagem.toFixed(2) * 100}%`

                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }




    function obterDadosVolumeMedio() {
       

        fetch(`/dashBateria/selectVolumeMedio/${id_bateria}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {


                        dadoNivelMedioBat.innerHTML = `${resposta[0].media_nivel}M`


                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }


     function obterDadosVolumeIndividual() {


        fetch(`/dashBateria/selectVolumeIndividual/${id_bateria}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        plotarGraficoVolumeIndividual(resposta)

                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }

    // let valores=[45, 78, 89, 10, 50, 29]
    // let labels=["silo1", "silo2", "silo3", "silo4", "silo5", "silo6"]

    function plotarGraficoVolumeIndividual(resposta) {
        let labels = [];
        let valores = [];
        for (let i = 0; i < resposta.length; i++) {
            let porcentagem = (resposta[i].preenchimento) / (resposta[i].total)
            labels.push(resposta[i].modelo)
            valores.push(porcentagem * 100)
        }


        const Criticos = valores.map((v) => {

            return v <= 15 || v >= 85 ? v : null;
        })
        const Moderado = valores.map((v) => {

            return (v <= 25 || v >= 75) && v > 15 && v < 85 ? v : null;
        })
        const Estavel = valores.map((v) => {

            return (v >= 26 && v <= 74) ? v : null;
        })



        console.log(valores)
        console.log(Criticos)

        const data = {
            labels: labels,
            datasets: [
                {
                    label: "Crítico",
                    backgroundColor: "rgb(245, 67, 67)",
                    borderColor: "rgb(245, 67, 67)",
                    data: Criticos,
                    barThickness: 50,
                    borderRadius: 5,
                },
                {
                    label: "Moderado",
                    backgroundColor: "rgb(255, 198, 42)",
                    borderColor: "rgb(255, 198, 42)",
                    data: Moderado,
                    barThickness: 50,
                    borderRadius: 5,
                },
                {
                    label: "Estável",
                    backgroundColor: "rgb(20, 245, 106)",
                    borderColor: "rgb(20, 245, 106)",
                    data: Estavel,
                    barThickness: 50,
                    borderRadius: 5,
                },
            ],
        };

        const config = {
            type: "bar",
            data: data,
            options: {
                maintainAspectRatio: false, // PERMITE QUE O GRÁFICO ESTIQUE NA VERTICAL
                responsive: true,
                scales: {
                    y: {
                        min: 0,
                        max: 100,
                        stacked: true

                    },
                    x: {
                        stacked: true,
                        offset: true
                    }

                },
                plugins: {
                    title: {
                        display: true,
                        text: "SITUAÇÃO DO NÍVEL DE CADA SILO",
                    },
                },
            },
        };
        const myChart = new Chart(
            document.getElementById("myChart"),
            config);
    }



    function obterDadosPreenchimentoMensal() {


        fetch(`/dashBateria/selectVolumeMensalBateria/${id_bateria}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        plotarGraficosPreenchimentoMensal(resposta)
                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }


    function plotarGraficosPreenchimentoMensal(resposta) {
        let labels2 = [];
        // let labels2=["Janeiro", "Fevereiro", "Março", "Abril"]

        const data2 = {
            labels: labels2,
            datasets: [
                {
                    label: "Nível de Preenchimento",
                    backgroundColor: "rgb(255, 0, 0)",
                    borderColor: "rgb(255, 0, 0)",
                    // data: [45, 90, 39, 20],
                    data: [],
                    tension: 0.3,
                },
            ],
        };


        for (let i = 0; i < resposta.length; i++) {
            labels2.push(resposta[i].modelo)

            if (resposta[i].mes == 1) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Janeiro")
            } else if (resposta[i].mes == 2) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Fevereiro")
            } else if (resposta[i].mes == 3) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Março")
            } else if (resposta[i].mes == 4) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Abril")
            } else if (resposta[i].mes == 5) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Maio")
            } else if (resposta[i].mes == 6) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Junho")
            } else if (resposta[i].mes == 7) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Julho")
            } else if (resposta[i].mes == 8) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Agosto")
            } else if (resposta[i].mes == 9) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Setembro")
            } else if (resposta[i].mes == 10) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Outubro")
            } else if (resposta[i].mes == 11) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Novembro")
            } else if (resposta[i].mes == 12) {
                data2.datasets[0].data.push(resposta[i].preenchimento_bateria)
                labels2.push("Dezembro")
            }
        }


        const config2 = {
            type: "line",
            data: data2,
            options: {
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                    },
                },
                plugins: {
                    title: {
                        display: true,
                        text: "NÍVEL DE PREENCHIMENTO DA BATERIA EM RELAÇÃO AO TEMPO",
                    },
                },
            },
        };
        const myChart2 = new Chart(
            document.getElementById("myChart2"),
            config2);
    }


    fetch(`/dashBateria/selectInfoSiloIndividual/${id_bateria}`, { cache: 'no-store' })
        .then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    for (let i = 0; i < resposta.length; i++) {
                        let corFundo = "";

                        console.log('RESPOSTAS: ', resposta);
                        
                        if (resposta[i].situacao == "Crítico") {
                            corFundo = "rgb(245, 67, 67)"
                        } else if (resposta[i].situacao == "Moderado") {
                            corFundo = "rgb(255, 198, 42)"
                        } else if (resposta[i].situacao == "Estável") {
                            corFundo = "rgb(20, 245, 106)"
                        }
                        
                        boxBotao.innerHTML += `
                        <a href="dashboard-individual.html?id_fazenda=${sessionStorage.ID_FAZENDA}&id_bateria=${resposta[i].idBateria}&id_silo_individual=${resposta[i].idSilo}">
                            <div id="nomeSilo" class="nomeSilo">${resposta[i].nome}</div>
                            <div id="botaoSiloIndividual" class="botaoSiloIndividual" style="background-color: ${corFundo};">
                                <img src="../assets/imgs/iconSiloIndiv.svg">
                            </div>
                        </a>`
                    }

                })

            } else {
                console.log("Nenhum dado encontrado")
            }

        })
        .catch(function (error) {
            console.error("Erro na obtenção de dados")
        })



     obterDadosPreenchimentoMensal(),
    obterDadosVolumeIndividual()
    obterDadosVolumeMaior()
    obterDadosVolumeMenor()
    obterDadosVolumeMedio()
    obterDadosVolumeTotal()
</script>



</html>
