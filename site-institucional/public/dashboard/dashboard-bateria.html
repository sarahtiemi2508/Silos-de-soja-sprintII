<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">

    <link rel="stylesheet" href="../css/dashboard-bateria.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <script src="../js/menu.js"></script>

    <script src="../js/sessao.js"></script>
    <title>Dashboard Bateria</title>

</head>

<body onload="validarSessao(); inicializarDash()">
    <div id="menu_hamburger"></div>
    <script>
        fetch("../includes/menu.html")
            .then(resposta => resposta.text())
            .then(dados => {
                document.getElementById("menu_hamburger").innerHTML = dados;
            });
    </script>

    <div class="titulos">
        <div class="titulo-pag">
            <img src="../assets/imgs/imagemtitulo.svg" alt="imagemTitulo">
            <h1 id="nomeBateria"></h1>
        </div>
        <h2 class="fazenda-grupo" id="nome_fazenda"></h2>
    </div>

    <div class="campos">

        <div class="campo-silo">
            <div id="boxNiveis">
                <div id="boxNiveisSilos">
                    <div id="boxNiveisBateria">
                        <div id="nivelTotalBateria">
                            <div id="titNivelTotalBat">Nível Total da Bateria</div>
                            <div id="dadoNivelTotalBat"></div>
                        </div>
                        <div id="nivelMediaBateria">
                            <div id="titNivelMedioBat">Nível Médio da Bateria</div>
                            <div id="dadoNivelMedioBat"></div>
                        </div>

                    </div>
                    <div id="graficosMaiorMenor">
                        <p id="tituloMaiorMenorNivel">MAIOR E MENOR NÍVEL DOS SILOS</p>
                        <div
                            style="display: flex; flex-direction: row; justify-content: space-evenly; width: 100%; background: transparent">
                            <div class="volumeSilo">
                                <p id="siloMaximo">--</p>
                                <div class="SilosNivel" id="siloMaior"></div>
                                <div class="porcentagem" id="maiorSilo">0<span>%</span></div>
                            </div>
                            <div class="volumeSilo">

                                <p id="siloMinimo">--</p>
                                <div class="SilosNivel" id="siloMenor"></div>
                                <div class="porcentagem" id="menorSilo">0<span>%</span></div>

                            </div>
                        </div>
                    </div>
                </div>
                <div id="situacaoNivelCadaSilo">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>

        <div id="parte2">
            <div class="campo-grafico">
                <canvas id="myChart2"></canvas>
            </div>
            <div id="boxSilosIndividuais">

                <div id="botoesSilosIndividuais">
                    <div class="boxBotao" id="boxBotao"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const id_fazenda = parametros.get("id_fazenda") || 1;
        const id_bateria = parametros.get("id_bateria_silo") || 1;
        sessionStorage.ID_FAZENDA = id_fazenda;

        let myChart = null;
        let myChart2 = null;

        function inicializarDash() {
            const ctx1 = document.getElementById("myChart");
            const ctx2 = document.getElementById("myChart2");

            if (ctx1) {
                myChart = new Chart(ctx1.getContext("2d"), {
                    type: "bar",
                    data: {
                        labels: [],
                        datasets: [
                            { label: "Crítico", backgroundColor: "#cf041f", data: [], barThickness: 50, borderRadius: 5 },
                            { label: "Moderado", backgroundColor: "#FFBA00", data: [], barThickness: 50, borderRadius: 5 },
                            { label: "Estável", backgroundColor: "#008000", data: [], barThickness: 50, borderRadius: 5 }
                        ]
                    },
                    options: { maintainAspectRatio: false, responsive: true, scales: { y: { min: 0, max: 100, stacked: true }, x: { stacked: true } }, plugins: { title: { display: true, text: "SITUAÇÃO DO NÍVEL DE CADA SILO" } } }
                });
            }

            if (ctx2) {
                myChart2 = new Chart(ctx2.getContext("2d"), {
                    type: "line",
                    data: {
                        labels: [],
                        datasets: [{ label: "Nível de Preenchimento", backgroundColor: "#cf041f", borderColor: "#cf041f", data: [], tension: 0.3 }]
                    },
                    options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { title: { display: true, text: "NÍVEL DE PREENCHIMENTO DA BATERIA EM RELAÇÃO AO TEMPO" } } }

                });
            }
            atualizarTudo();
            setInterval(atualizarTudo, 3000);
        }

        function carregarTitulos() {

            fetch(`/dashBateria/selectInfoBateria/${id_bateria}`).then(res => res.json()).then(res => {
                if (res.length > 0) document.getElementById("nomeBateria").innerHTML = `BATERIA: ${res[0].nome}`;
            }).catch(() => { });

            fetch(`/dashBateria/selectInfoFazenda/${id_fazenda}`).then(res => res.json()).then(res => {
                if (res.length > 0) document.getElementById("nome_fazenda").innerHTML = `Fazenda: ${res[0].nome}`;
            }).catch(() => { });

        }

        function obterDadosVolumeTotal() {
            fetch(`/dashBateria/selectVolumeTotal/${id_bateria}`).then(res => res.json()).then(res => {
                if (res.length > 0) document.getElementById("dadoNivelTotalBat").innerHTML = `${parseFloat(res[0].nivelTotal).toFixed(2)} m³`;
            }).catch(() => { });
        }

        function obterDadosVolumeMaior() {
            fetch(`/dashBateria/selectMaiorNivel/${id_bateria}`).then(res => res.json()).then(res => {
                if (res.length > 0) {
                    document.getElementById("siloMaximo").innerHTML = `Silo ${res[0].modelo}`;
                    let pct = (res[0].preenchimento / res[0].total) * 100;
                    let cor = pct > 85 || pct < 15 ? '#cf041f' : pct > 75 || pct < 25 ? '#FFBA00' : '#008000';
                    document.getElementById("siloMaior").innerHTML = `<div style="height:${pct}%; background-color:${cor}; width:100%;"></div>`;
                    document.getElementById("maiorSilo").innerHTML = `${pct.toFixed(1)}<span>%</span>`;
                }
            }).catch(() => { });
        }

        function obterDadosVolumeMenor() {
            fetch(`/dashBateria/selectMenorNivel/${id_bateria}`).then(res => res.json()).then(res => {
                if (res.length > 0) {
                    document.getElementById("siloMinimo").innerHTML = `Silo ${res[0].modelo}`;
                    let pct = (res[0].preenchimento / res[0].total) * 100;
                    let cor = pct > 85 || pct < 15 ? '#cf041f' : pct > 75 || pct < 25 ? '#FFBA00' : '#008000';
                    document.getElementById("siloMenor").innerHTML = `<div style="height:${pct}%; background-color:${cor}; width:100%;"></div>`;
                    document.getElementById("menorSilo").innerHTML = `${pct.toFixed(1)}<span>%</span>`;
                }
            }).catch(() => { });

        }

        function obterDadosVolumeMedio() {
            fetch(`/dashBateria/selectVolumeMedio/${id_bateria}`).then(res => res.json()).then(res => {
                if (res.length > 0) document.getElementById("dadoNivelMedioBat").innerHTML = `${parseFloat(res[0].media_nivel).toFixed(2)} m³`;
            }).catch(() => { });

        }

        function obterDadosVolumeIndividual() {
            fetch(`/dashBateria/selectVolumeIndividual/${id_bateria}`).then(res => res.json()).then(resposta => {
                if (!myChart) return;
                let labels = []; let Criticos = []; let Moderado = []; let Estavel = [];
                for (let i = 0; i < resposta.length; i++) {
                    let v = (resposta[i].preenchimento / resposta[i].total) * 100;
                    labels.push(resposta[i].modelo);
                    Criticos.push(v <= 15 || v > 85 ? v : null);
                    Moderado.push((v > 15 && v <= 25) || (v > 75 && v <= 85) ? v : null);
                    Estavel.push(v > 25 && v <= 75 ? v : null);
                }

                myChart.data.labels = labels;
                myChart.data.datasets[0].data = Criticos;
                myChart.data.datasets[1].data = Moderado;
                myChart.data.datasets[2].data = Estavel;
                myChart.update();
            }).catch(() => { });
        }

        function obterDadosPreenchimentoMensal() {
            fetch(`/dashBateria/selectVolumeMensalBateria/${id_bateria}`).then(res => res.json()).then(resposta => {

                if (!myChart2) return;

                let labels2 = []; let data2 = [];

                const nomeMeses = ["", "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

                for (let i = 0; i < resposta.length; i++) {

                    labels2.push(nomeMeses[resposta[i].mes] || "Mês");

                    data2.push(resposta[i].preenchimento_bateria);

                }

                myChart2.data.labels = labels2;

                myChart2.data.datasets[0].data = data2;

                myChart2.update();

            }).catch(() => { });

        }



        function obterBotoesSilos() {

            fetch(`/dashBateria/selectInfoSiloIndividual/${id_bateria}`).then(res => res.json()).then(resposta => {

                let boxBotao = document.getElementById("boxBotao");

                if (!boxBotao) return;



                boxBotao.innerHTML = '';



                for (let i = 0; i < resposta.length; i++) {

                    let corFundo = resposta[i].situacao == "Crítico" ? "#cf041f" : resposta[i].situacao == "Moderado" ? "#FFBA00" : "#008000";

                    boxBotao.innerHTML += `

                <a href="dashboard-individual.html?id_fazenda=${id_fazenda}&id_bateria=${resposta[i].idBateria}&id_silo_individual=${resposta[i].idSilo}">

                    <div class="nomeSilo">${resposta[i].nome}</div>

                    <div class="botaoSiloIndividual" style="background-color: ${corFundo};">

                        <img src="../assets/imgs/iconSiloIndiv.svg">

                    </div>

                </a>`;

                }

            }).catch(() => { });

        }

        function atualizarTudo() {
            carregarTitulos();
            obterDadosVolumeTotal();
            obterDadosVolumeMaior();
            obterDadosVolumeMenor();
            obterDadosVolumeMedio();
            obterDadosVolumeIndividual();
            obterDadosPreenchimentoMensal();
            obterBotoesSilos();
        }

    </script>

</body>

</html>
