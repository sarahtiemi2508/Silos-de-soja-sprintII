<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fazendas</title>
    <link rel="stylesheet" href="../css/cadFazenda.css">
    <script src="../js/menu.js"></script>

    <!-- Icons -->
  <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
  <link rel="shortcut icon" href="../assets/icon/favicon-light.ico"
    media="(prefers-color-scheme: light)">

    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao(), listarUsuario()">
    <div id="imgFundo">
        <div class="blur">

            <div id="menu_hamburger"></div>
    
            <main>
    
                <div id="titulo">
                    <img id="imgTitulo" src="../assets/imgs/fazenda.png">
                    <h1>Fazendas</h1>
                </div>
        
                <div id="boxes">

                    <div class="box-fazenda cadastrar">
                        <div id="circuloAmarelo">
                            <div onclick="add()">+</div>
                        </div>
                        <div id="textoAddFazenda">adicionar fazenda</div>
                    </div>
        
                </div>
    
            </main>

        </div>
    </div>
    <script data-jsd-embedded data-key="72523777-24ce-4b21-b44e-230a68531778" data-base-url="https://jsd-widget.atlassian.com" src="https://jsd-widget.atlassian.com/assets/embed.js"></script>
</body>
<script>
    fetch("../includes/menu.html")
        .then(resposta => resposta.text())
        .then(dados => {
            document.getElementById("menu_hamburger").innerHTML = dados;
    });
</script>
<script>

    var id_usuario = sessionStorage.ID_USUARIO;
    var id_empresa = sessionStorage.ID_EMPRESA;    

    async function listarUsuario() {

        const retornoUsuario = await fetch(`../fazenda/listarTipoUsuario/${id_usuario}`);
        const retornoUsuarioConvertido = await retornoUsuario.json();
        const usuario = retornoUsuarioConvertido;

        console.log(usuario);

        if (usuario[0].tipo_usuario === "AdmEmpresa") {
            listarFazendasEmpresa();
        } else {
            listarFazendas();
        }

    }

    async function listarFazendasEmpresa() {

        const retornoFazendasEmpresa = await fetch(`../fazenda/listarFazendasEmpresa/${id_empresa}`);
        const retornoFazendasEmpresaConvertido = await retornoFazendasEmpresa.json();
        const fazendasE = retornoFazendasEmpresaConvertido;

        console.log(fazendasE);

        exibirFazendas(fazendasE);
        
    }

    async function listarFazendas() {

        const retornoFazendas = await fetch(`../fazenda/listarFazendas/${id_usuario}`);
        const retornoFazendasConvertido = await retornoFazendas.json();
        const fazendas = retornoFazendasConvertido;

        console.log(fazendas);

        exibirFazendas(fazendas);
        
    }

    async function exibirFazendas(fazendas) {

        for (let i = 0; i < fazendas.length; i++) {

            let nome_fazenda = fazendas[i].nome;
            let qtd_silos = fazendas[i].qtd_silos;
            let qtd_bateria = fazendas[i].qtd_bateria;
            let estaveis = fazendas[i].estaveis;
            let moderados = fazendas[i].moderados;
            let criticos = fazendas[i].criticos;
            let responsavel = fazendas[i].responsavel;
            let contato = fazendas[i].contato;
            let endereco = fazendas[i].endereco;
            
            let id_fazenda = fazendas[i].id_fazenda
            boxes.innerHTML += `
                <div class="box-fazenda">
                    <div class="tituloFazenda">${nome_fazenda}</div>
                    <div class="content-infos">
                        <div class="infos-fazenda">
                            <div class="situacoes">
                                <h3>situações</h3>
                                <div class="box-situacoes">
                                    <div class="box-sit sit-estavel" id="qtd_estavel">${estaveis}</div>
                                    <div class="box-sit sit-moderada" id="qtd_moderado">${moderados}</div>
                                    <div class="box-sit sit-critica" id="qtd_critico">${criticos}</div>
                                </div>
                            </div>
                            <div class="totais">
                                <b>total de silos:</b>
                                <span id="qtd_silos">${qtd_silos}</span>
                            </div>
                            <div class="totais">
                                <b>total de baterias:</b>
                                <span id="qtd_baterias">${qtd_bateria}</span>
                            </div>
                        </div>
                        <hr>
                        <div class="infos-responsavel">
                            <div class="info">
                                <h3>responsavel: </h3>
                                <p id="id_responsavel">${responsavel}</p>
                            </div>
                            <div class="info">
                                <h3>contato: </h3>
                                <p id="id_resp_contato">${contato}</p>
                            </div>
                            <div class="info">
                                <h3>cidade e uf: </h3>
                                <p id="id_cidade_uf">${endereco}</p>
                            </div>
                        </div>
                    </div>
                    <div class="boxBotoes">
                        <a class="styleBotao vizu" href="visualizar_bateria.html?id_fazenda=${id_fazenda}">visualizar -></a>
                        <a class="styleBotao conf" onclick="abrirGerenciarFazendas(${id_fazenda})"></a>
                    </div>
                </div>
            `;
            
        }

    }

    // Função pra ele gerenciar a fazenda quando ele clicar na engrenagem
    function abrirGerenciarFazendas(idFazendaClicada) {
    // Salva a fazenda q cliclou no session storage
    sessionStorage.ID_FAZENDA_ATUAL = idFazendaClicada;
    // manda pra tela de gerenciar
    window.location.href = "gerenciar_fazendas.html";
}

function add() {
    window.location.href = "cadastrar_fazenda.html";
}
</script>

</html>
