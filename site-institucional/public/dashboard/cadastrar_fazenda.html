<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Fazendas</title>
    <link rel="stylesheet" href="../css/cadFazenda.css"/>
    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">
    <script src="../js/menu.js"></script>

    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>
  </head>

  <body onload="validarSessao()">
    <div id="imgFundo">
      <div class="blur">
        <div id="menu_hamburger"></div>

        <main class="main-cadastrar">
          <div class="titulo">
            <img id="imgTitulo" src="../assets/imgs/fazenda.png" />
            <h1>adicionar Fazenda</h1>
          </div>

          <div class="container-cadastro">
            <!-- Colunm -->

            <div class="indicacao-parte">
              <!-- Row -->
              <div class="circulo-atual" id="passo1">1</div>
              <hr />
              <div class="circulo" id="passo2">2</div>
              <hr />
              <div class="circulo" id="passo3">3</div>
            </div>

            <div class="content-infos-cadastro" id="content-infos-cadastro1">
              <!-- Colunm -->
              <div class="sobre-fazenda">
                <h1>Nos conte um pouco sobre a sua fazenda</h1>
                <div class="inputs nome">
                  <label for="ipt_nome_fazenda">Nome: </label>
                  <input
                    type="text"
                    id="ipt_nome_fazenda"
                    placeholder="Qual é o nome da sua fazenda?"
                  />
                </div>
              </div>

              <div class="endereco-fazenda-infos">
                <!-- Colunm -->
                <h3>Onde ela fica?</h3>
                <div class="inputs logradouro">
                  <label for="ipt_logradouro">logradouro: </label>
                  <input
                    type="text"
                    id="ipt_logradouro"
                    placeholder="Ex: Rua Das Flores"
                  />
                </div>
                <div class="inputs-dupla cep-numero">
                  <!-- Row -->
                  <div class="inputs cep">
                    <!-- Colunm -->
                    <label for="ipt_cep">cep: </label>
                    <input
                      type="text"
                      id="ipt_cep"
                      placeholder="Ex: 013-81005"
                    />
                  </div>
                  <div class="inputs numero">
                    <!-- Colunm -->
                    <label for="ipt_numero">numero: </label>
                    <input type="text" id="ipt_numero" placeholder="Ex: 454" />
                  </div>
                </div>
                <div class="inputs-dupla uf-cidade">
                  <!-- Row -->
                  <div class="inputs uf">
                    <!-- Colunm -->
                    <label for="ipt_uf">uf: </label>
                    <input type="text" id="ipt_uf" placeholder="Ex: MG" />
                  </div>
                  <div class="inputs cidade">
                    <!-- Colunm -->
                    <label for="ipt_cidade">cidade: </label>
                    <input
                      type="text"
                      id="ipt_cidade"
                      placeholder="Ex: Diamantina"
                    />
                  </div>
                </div>
              </div>
              <button class="continuar" onclick="enviarParte1()">
                continuar
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
  <script>
    fetch("../includes/menu.html")
      .then((resposta) => resposta.text())
      .then((dados) => {
        document.getElementById("menu_hamburger").innerHTML = dados;
      });

      let id_empresa = sessionStorage.getItem("ID_EMPRESA");

      function enviarParte1() {
        let nome_fazenda = ipt_nome_fazenda.value 
        let logradouro = ipt_logradouro.value
        let cep = ipt_cep.value
        let numero = ipt_numero.value
        let uf = ipt_uf.value.toUpperCase()

        let cidade = ipt_cidade.value

        if (nome_fazenda == "" || logradouro == "" || cep == "" || numero == "" || uf == "" || cidade == "") {
          alert("Preencha todos os dados para que o cadastro da fazenda seja feito")
          return
        }
        else if (nome_fazenda == null || logradouro == null || cep == null || numero == null || uf == null || cidade == null) {
          alert("Ocorreu um problema no cadastro da fazenda. Nosso sistema está detectando campos de valor nulo. Por favor, reinicie a página e tente novamente. Caso o problema persista, entre em contato com nossa equipe.")
          return
        }
        if (!cep.includes("-")) {
          alert(`insira o cep neste formato para continuar: "01001-001" `)
          return
        }



fetch("/cadastrar_fazenda", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeFazendaServer: nome_fazenda,
                logradouroServer: logradouro,
                cepServer: cep,
                numeroServer: numero,
                ufServer: uf,
                cidadeServer: cidade,
                fkEmpresaServer: id_empresa
            })
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dadosDoBack) {
                    var idFazendaCriada = dadosDoBack.resultado.insertId;
                    sessionStorage.setItem("ID_FAZENDA_ATUAL", idFazendaCriada);
                    
                    console.log("Fase 1 cadastrada com sucesso! ID da fazenda: " + idFazendaCriada);
                    atualizarTela();
                });
            } else {
                // Captura erros estruturados vindos do banco de dados (ex: erro de SQL)
                resposta.json().then(function (erroDoBack) {
                    console.log("Erro detalhado do Servidor:", erroDoBack);
                    alert("Erro no banco de dados: " + (erroDoBack.erro || "Verifique os dados enviados."));
                }).catch(() => {
                    // Fallback seguro caso o servidor envie um erro em formato texto/HTML
                    resposta.text().then(function (textoErro) {
                        console.error("Erro bruto do servidor:", textoErro);
                        alert("Houve um erro no servidor. Verifique o terminal do Node.");
                    });
                });
            }
        })
        .catch(function (erro) {
            console.log("Erro de conexão com a rede:", erro);
        });
      }

      function atualizarTela() {
        const elemento = document.getElementById("passo2")
        elemento.classList.replace("circulo", "circulo-atual");

        const conteudo_parte1 = document.getElementById("content-infos-cadastro1");

        const conteudo_parte2 = `
    <div class="content-infos-cadastro" id="content-infos-cadastro2">
        <div class="sobre-fazenda">
            <h1>CADASTRE UM RESPONSÁVEL</h1>
            <p id="conta_responsavel">Crie uma conta responsável pela sua fazenda. <b>ATENÇÃO</b>, essa conta só terá acesso a essa fazenda.</p>
            
            <div class="inputs nome">
                  <label for="ipt_nome_admin">Nome: </label>
                  <input type="text" id="ipt_nome_admin" placeholder="Digite o nome do Administrador da fazenda"/>
            </div>
            <div class="inputs nome">
                  <label for="ipt_email_admin">Email: </label>
                  <input type="text" id="ipt_email_admin" placeholder="Digite o email do Administrador da fazenda"/>
            </div>
            <div class="inputs nome">
                  <label for="ipt_cpf_admin">Cpf: </label>
                  <input type="text" id="ipt_cpf_admin" placeholder="Digite o cpf do Administrador da fazenda"/>
            </div>
            <div class="inputs nome">
                  <label for="ipt_senha_admin">Senha: </label>
                  <input type="text" id="ipt_senha_admin" placeholder="Digite a senha do Administrador da fazenda"/>
            </div>
            <div class="inputs nome">
                  <label for="ipt_senha_confirmar_admin">Confirmar senha: </label>
                  <input type="text" id="ipt_senha_confirmar_admin" placeholder="Confirme a senha do Administrador da fazenda"/>
            </div>
            <button class="continuar" onclick="enviarParte2()">continuar</button>


        </div>
    </div>
    
  `;
    conteudo_parte1.innerHTML = conteudo_parte2;
      }


      function enviarParte2() {
        let nome = ipt_nome_admin.value
        let email = ipt_email_admin.value
        let cpf = ipt_cpf_admin.value
        let senha = ipt_senha_admin.value
        let senha_confirmar = ipt_senha_confirmar_admin.value
        
        var id_fazenda = sessionStorage.getItem("ID_FAZENDA_ATUAL");

        let posicao_arroba
        let posicao_com

        if (nome == "" || email == "" || cpf == "" || senha == "" || senha_confirmar == "") {
          alert("Preencha todos os dados para que o cadastro do responsável seja feito")
          return
        }
        else if (nome == null || email == null || cpf == null || senha == null || senha_confirmar == null) {
          alert("Ocorreu um problema no cadastro de responsável. Nosso sistema está detectando campos de valor nulo. Por favor, reinicie a página e tente novamente. Caso o problema persista, entre em contato com nossa equipe.")
          return
        }
        else if (senha != senha_confirmar) {
          alert("A confirmação da senha inserida está diferente da senha inserida")
          return
        }

      }









  </script>
</html>
