<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Icons -->
    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard-individual.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />

    <script src="../js/menu.js"></script>
    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>


    <title>Dashboard</title>
</head>

<body onload="carregarTodosDadosDashboard()">
    <div id="menu_hamburger"></div>
    <script>
        fetch("../includes/menu.html")
            .then(resposta => resposta.text())
            .then(dados => {
                document.getElementById("menu_hamburger").innerHTML = dados;
            });
    </script>

    <div class="titulo-pag">
        <img src="../assets/imgs/siloicon.svg" alt="icone de silo">
        <h1>SITUAÇÃO DO SILO</h1>
    </div>

    <div class="campos">
        <div class="campo-silo">
            <div class="alinhamento-campo-silo">

                <div class="cards-kpi">
                    <div class="kpi-live">
                        <span>Espaço livre para armazenamento</span>
                        <h3>-- m</h3>
                        <h4>Porcentagem</h4>
                    </div>

                    <div class="kpi-ultima-leitura">
                        <span> <strong>Última leitura</strong> ocorreu há:</span>
                        <h3>-- seg</h3>
                        <h4>28/04/2026</h4>
                        <p>HH:mm:ss</p>
                    </div>
                </div>

                <div class="controle-silo-bateria">
                    <div class="fazenda">Fazenda XPTO</div>
                    <span>SILOS DA BATERIA</span>
                    <p>Bateria atual: <span id="label-bateria-atual">...</span></p>

                    <div class="bateria-grid">
                        <button class="btn-silo active">1</button>
                        <button class="btn-silo">2</button>
                        <button class="btn-silo">3</button>
                        <button class="btn-silo">4</button>
                        <button class="btn-silo">5</button>
                        <button class="btn-silo">6</button>
                        <button class="btn-silo">7</button>
                        <button class="btn-silo">8</button>
                    </div>

                    <a href="#" class="link-bateria">VER SITUAÇÃO DA BATERIA <span>&rarr;</span></a>
                </div>


                <div class="silo-container">
                    <img src="../assets/imgs/silosvg.svg" class="silo-overlay">

                    <div class="silo-zona-enchimento">
                        <div id="silo-preenchimento" class="silo-barra"></div>
                    </div>
                </div>

                <div class="cards-kpi">
                    <div class="kpi-status">
                        <span>Estado do silo</span>
                        <div class="estado">
                            <h3 style="color: #FFBA00;">--</h3>
                        </div>
                        <h4 id="id_silo_mais">Ação</h4>
                    </div>
                    <div class="kpi-tempo-alerta">
                        <span>Tempo em alerta</span>
                        <h3>0D 0h 0m</h3>
                    </div>
                </div>
            </div>

        </div>

        <div class="campo-grafico">
            <div class="campo-grafico" style="position: relative; width: 90vw; height: 500px;">
                <canvas id="graficoSilo"></canvas>
            </div>
        </div>

    </div>

</body>
<script>

    //  const id_fazenda = parametros_silo.get("id_fazenda")
    // const id_bateria = parametros_silo.get("id_bateria");
    // const id_silo_individual = parametros_silo.get("id_silo_individual")


    //console.log(`ID DA FAZENDA: `, id_fazenda)
    //console.log(`ID DA BATERIA: `, id_bateria);
    // console.log(`ID DO SILO: `,  id_silo_individual);

    // Id fixo p testar. Depois vai vir do session storage quando o usuario tiver logado
    // Id fixo p testar. Depois vai vir do session storage quando o usuario tiver logado
    let idSiloAtual = 1;
    let idBateriaAtual = 1;
    let tempoInicioAlerta = null;

    const contextoGrafico = document.getElementById('graficoSilo').getContext('2d');
    let graficoLinha = new Chart(contextoGrafico, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Nível de preenchimento (m)',
                borderColor: '#FFBA00',
                backgroundColor: 'rgba(255, 186, 0, 0.2)',
                borderWidth: 3,
                fill: true,
                data: []
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: 'Nível de preenchimento ao longo do tempo',
                    font: { size: 16 }
                }
            },
            scales: { y: { beginAtZero: true } }
        }
    });

    function attDadosBateria() {
        fetch(`/silos/bateria/${idBateriaAtual}`)
            .then(resposta => resposta.json())
            .then(silosDaBateria => {
                if (silosDaBateria.length == 0) return;

                document.getElementById('label-bateria-atual').innerHTML = idBateriaAtual;
                let divBotoes = document.querySelector('.bateria-grid');
                divBotoes.innerHTML = '';

                let siloMaisVazio = silosDaBateria[0];
                let siloMaisCheio = silosDaBateria[0];

                for (let i = 0; i < silosDaBateria.length; i++) {
                    let silo = silosDaBateria[i];

                    if (parseFloat(silo.preenchimento) < parseFloat(siloMaisVazio.preenchimento)) siloMaisVazio = silo;
                    if (parseFloat(silo.preenchimento) > parseFloat(siloMaisCheio.preenchimento)) siloMaisCheio = silo;

                    let porcentagem = parseFloat(silo.preenchimento);
                    let corFundo = "";
                    let corTexto = "white";

                    // BOTAAAAOOOOO
                    if (porcentagem > 85 || porcentagem < 15) {
                        corFundo = "#cf041f";
                    } else if ((porcentagem >= 76 && porcentagem <= 85) || (porcentagem >= 15 && porcentagem <= 25)) {
                        corFundo = "#FFBA00";
                        corTexto = "black";
                    } else {
                        corFundo = "#008000";
                    }

                    let classeAtiva = silo.idSilo == idSiloAtual ? 'active' : '';
                    divBotoes.innerHTML += `<button class="btn-silo ${classeAtiva}" style="background-color: ${corFundo}; color: ${corTexto}; border: 1px solid #333;" onclick="mudarSilo(${silo.idSilo})">${silo.modelo}</button>`;
                }

                let siloExibidoNaTela = silosDaBateria.find(s => s.idSilo == idSiloAtual);
                let textoAcao = document.getElementById('id_silo_mais');

                if (siloExibidoNaTela) {
                    let preenchimentoAtual = parseFloat(siloExibidoNaTela.preenchimento);

                    if (preenchimentoAtual > 85) {
                        textoAcao.innerHTML = `Esvaziar silo urgentemente`;
                    } else if (preenchimentoAtual < 15) {
                        textoAcao.innerHTML = `Abastecer silo urgentemente`;
                    } else if (preenchimentoAtual > 75) {
                        textoAcao.innerHTML = `Transferir excesso para o ${siloMaisVazio.modelo}`;
                    } else if (preenchimentoAtual < 26) {
                        textoAcao.innerHTML = `Abastecer usando o ${siloMaisCheio.modelo}`;
                    } else {
                        textoAcao.innerHTML = `nenhuma ação necessaria`;
                    }
                }
            })
            .catch(erro => console.log(`#ERRO BATERIA: ${erro}`));
    }

    function attGraficoseKpis() {
        fetch(`/silos/dados/${idSiloAtual}`)
            .then(resposta => resposta.json())
            .then(dadosSensor => {
                if (dadosSensor.length == 0) return;
                dadosSensor.reverse();

                let labelsNovo = [];
                let dadosGraficoNovo = [];

                for (let i = 0; i < dadosSensor.length; i++) {
                    labelsNovo.push(dadosSensor[i].momento_grafico);
                    let nivel = parseFloat(dadosSensor[i].altura_silo) - parseFloat(dadosSensor[i].distancia);
                    dadosGraficoNovo.push(nivel < 0 ? 0 : nivel);
                }

                graficoLinha.data.labels = labelsNovo;
                graficoLinha.data.datasets[0].data = dadosGraficoNovo;
                graficoLinha.update();

                let ultima = dadosSensor[dadosSensor.length - 1];
                let altura = parseFloat(ultima.altura_silo);
                let distancia = parseFloat(ultima.distancia);

                if (distancia < 0) distancia = 0;
                if (distancia > altura) distancia = altura;

                let pctLivre = (distancia / altura) * 100;
                let pctCheia = 100 - pctLivre;

                attStatuseCronometro(pctCheia);

                document.getElementById('silo-preenchimento').style.height = `${pctCheia}%`;
                document.querySelector('.kpi-live h3').innerHTML = `${distancia.toFixed(1)} m`;
                document.querySelector('.kpi-live h4').innerHTML = `${Math.round(pctLivre)}% livre`;

                let dataAtualFormatada = new Date().toLocaleDateString('pt-BR');
                let momentoLeitura = new Date(new Date().toISOString().slice(0, 10) + 'T' + ultima.momento_grafico + 'Z');
                let seg = Math.floor((new Date() - momentoLeitura) / 1000);

                document.querySelector('.kpi-ultima-leitura h4').innerHTML = dataAtualFormatada;
                document.querySelector('.kpi-ultima-leitura p').innerHTML = ultima.momento_grafico;
                document.querySelector('.kpi-ultima-leitura h3').innerHTML = `${seg} seg`;
            })
            .catch(erro => console.log(`#ERRO KPI: ${erro}`));
    }

    function attStatuseCronometro(porcentagemCheia) {
        const statusTitulo = document.querySelector('.kpi-status h3');
        const tempoAlertaHtml = document.querySelector('.kpi-tempo-alerta h3');
        const barraSilo = document.getElementById('silo-preenchimento');

        //Estável entre 26 e 75
        if (porcentagemCheia >= 26 && porcentagemCheia <= 75) {
            statusTitulo.innerHTML = "ESTÁVEL";
            statusTitulo.style.color = "#008000"; // Verde
            barraSilo.style.backgroundColor = "#008000";
            tempoInicioAlerta = null;
            tempoAlertaHtml.innerHTML = "0D 0h 0m 0s";
        } else {
            // é crítico ou moderado)
            if (tempoInicioAlerta == null) tempoInicioAlerta = new Date();

            let diferencaTempo = new Date() - tempoInicioAlerta;
            let d = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            let h = Math.floor((diferencaTempo % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let m = Math.floor((diferencaTempo % (1000 * 60 * 60)) / 60000);
            let s = Math.floor((diferencaTempo % 60000) / 1000);
            tempoAlertaHtml.innerHTML = `${d}D ${h}h ${m}m ${s}s`;

            // crítico se for > 85 ou < 15
            if (porcentagemCheia > 85 || porcentagemCheia < 15) {
                statusTitulo.innerHTML = "CRÍTICO";
                statusTitulo.style.color = "#cf041f";
                barraSilo.style.backgroundColor = "#cf041f";
            } else {
                // Moderado
                statusTitulo.innerHTML = "MODERADO";
                statusTitulo.style.color = "#FFBA00";
                barraSilo.style.backgroundColor = "#FFBA00";
            }
        }
    }

    function mudarSilo(id) {
        idSiloAtual = id;
        attDadosBateria();
        attGraficoseKpis();
    }

    function carregarTodosDadosDashboard() {
        attDadosBateria();
        attGraficoseKpis();
        setInterval(() => {
            attGraficoseKpis();
            attDadosBateria();
        }, 2000);
    }
</script>

</html>
