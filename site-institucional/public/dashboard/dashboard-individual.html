<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Icons -->
    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard-individual.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />

    <script src="../js/menu.js"></script>
    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>


    <title>Dashboard</title>
</head>

<body onload="carregarTodosDadosDashboard()">
    <div id="menu_hamburger"></div>
    <script>
        fetch("../includes/menu.html")
            .then(resposta => resposta.text())
            .then(dados => {
                document.getElementById("menu_hamburger").innerHTML = dados;
            });
    </script>

    <div class="titulo-pag">
        <img src="../assets/imgs/siloicon.svg" alt="icone de silo">
        <h1>SITUAÇÃO DO SILO</h1>
    </div>

    <div class="campos">
        <div class="campo-silo">
            <div class="alinhamento-campo-silo">

                <div class="cards-kpi">
                    <div class="kpi-live">
                        <span>Espaço livre para armazenamento</span>
                        <h3>-- m</h3>
                        <h4>Porcentagem</h4>
                    </div>

                    <div class="kpi-ultima-leitura">
                        <span> <strong>Última leitura</strong> ocorreu há:</span>
                        <h3>-- seg</h3>
                        <h4>28/04/2026</h4>
                        <p>HH:mm:ss</p>
                    </div>
                </div>

                <div class="controle-silo-bateria">
                    <div class="fazenda">Fazenda XPTO</div>
                    <span>SILOS DA BATERIA</span>
                    <p>Bateria atual: 67</p>

                    <div class="bateria-grid">
                        <button class="btn-silo active">1</button>
                        <button class="btn-silo">2</button>
                        <button class="btn-silo">3</button>
                        <button class="btn-silo">4</button>
                        <button class="btn-silo">5</button>
                        <button class="btn-silo">6</button>
                        <button class="btn-silo">7</button>
                        <button class="btn-silo">8</button>
                    </div>

                    <a href="#" class="link-bateria">VER SITUAÇÃO DA BATERIA <span>&rarr;</span></a>
                </div>


                <div class="silo-container">
                    <img src="../assets/imgs/silosvg.svg" class="silo-overlay">

                    <div class="silo-zona-enchimento">
                        <div id="silo-preenchimento" class="silo-barra"></div>
                    </div>
                </div>

                <div class="cards-kpi">
                    <div class="kpi-status">
                        <span>Estado do silo</span>
                        <div class="estado">
                            <h3 style="color: #FFBA00;">--</h3>
                        </div>
                        <h4 id="id_silo_mais">Ação</h4>
                    </div>
                    <div class="kpi-tempo-alerta">
                        <span>Tempo em alerta</span>
                        <h3>0D 0h 0m</h3>
                    </div>
                </div>
            </div>

        </div>

        <div class="campo-grafico">
            <div class="campo-grafico" style="position: relative; width: 90vw; height: 500px;">
                <canvas id="graficoSilo"></canvas>
            </div>
        </div>

    </div>

</body>
<script>
    // Id fixo p testar. Depois vai vir do session storage quando o usuario tiver logado
    let idSiloAtual = 1;
    let idBateriaAtual = 1;
    let tempoInicioAlerta = null;

    const contextoGrafico = document.getElementById('graficoSilo').getContext('2d');
    let graficoLinha = new Chart(contextoGrafico, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Distância capturada pelo sensor',
                borderColor: '#FFBA00',
                backgroundColor: 'rgba(255, 186, 0, 0.2)',
                borderWidth: 3,
                fill: true,
                data: []
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    function attDadosBateria() {
        fetch(`/silos/bateria/${idBateriaAtual}`)
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (silosDaBateria) {


                        if (silosDaBateria.length == 0) {
                            console.log("Nenhum silo encontrado para esta bateria");
                            return;
                        }

                        let divBotoes = document.querySelector('.bateria-grid');
                        divBotoes.innerHTML = '';

                        let siloMaisVazio = silosDaBateria[0];
                        let siloMaisCheio = silosDaBateria[0];

                        for (let i = 0; i < silosDaBateria.length; i++) {
                            let silo = silosDaBateria[i];

                            if (silo.preenchimento < siloMaisVazio.preenchimento) siloMaisVazio = silo;
                            if (silo.preenchimento > siloMaisCheio.preenchimento) siloMaisCheio = silo;

                            let porcentagemLivre = 100 - parseFloat(silo.preenchimento);
                            let corFundo = "";
                            let corTexto = "white";

                            if (porcentagemLivre >= 30 && porcentagemLivre <= 70) {
                                corFundo = "#008000";
                            } else if (porcentagemLivre < 15 || porcentagemLivre > 85) {
                                corFundo = "#cf041f";
                            } else {
                                corFundo = "#FFBA00";
                                corTexto = "black";
                            }

                            let classeAtiva = silo.idSilo == idSiloAtual ? 'active' : '';

                            divBotoes.innerHTML += `<button class="btn-silo ${classeAtiva}" style="background-color: ${corFundo}; color: ${corTexto}; border: 1px solid #333;" onclick="mudarSilo(${silo.idSilo})">${silo.modelo}</button>`;
                        }

                        // Pra nao ecoar pra si mesmo
                        let textoAcao = document.getElementById('id_silo_mais');
                        let siloExibidoNaTela = silosDaBateria.find(s => s.idSilo == idSiloAtual);

                        if (siloExibidoNaTela) {
                            if (siloExibidoNaTela.preenchimento > 70 && siloMaisVazio.idSilo != idSiloAtual) {
                                textoAcao.innerHTML = `Escoar para ${siloMaisVazio.modelo}`;
                            } else if (siloExibidoNaTela.preenchimento < 25 && siloMaisCheio.idSilo != idSiloAtual) {
                                textoAcao.innerHTML = `Preencher a partir de ${siloMaisCheio.modelo}`;
                            } else {
                                textoAcao.innerHTML = `Manter nível`;
                            }
                        }

                    });
                } else {
                    console.log("Houve um erro buscando a bateria");
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }

    function attGraficoseKpis() {
        fetch(`/silos/dados/${idSiloAtual}`)
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (dadosSensor) {

                        if (dadosSensor.length == 0) {
                            console.log("Nenhum dado encontrado para este silo");
                            return;
                        }

                        dadosSensor.reverse();

                        let labelsNovo = [];
                        let dadosGraficoNovo = [];

                        for (let i = 0; i < dadosSensor.length; i++) {
                            let registro = dadosSensor[i];
                            labelsNovo.push(registro.momento_grafico);

                            let valorLimpo = parseFloat(registro.distancia);
                            if (valorLimpo < 0) {
                                valorLimpo = 0;
                            }
                            dadosGraficoNovo.push(valorLimpo);
                        }

                        graficoLinha.data.labels = labelsNovo;
                        graficoLinha.data.datasets[0].data = dadosGraficoNovo;
                        graficoLinha.update();

                        let ultimaLeitura = dadosSensor[dadosSensor.length - 1];
                        let alturaSilo = parseFloat(ultimaLeitura.altura_silo);
                        let distanciaLida = parseFloat(ultimaLeitura.distancia);

                        if (distanciaLida < 0) {
                            distanciaLida = 0;
                        }
                        if (distanciaLida > alturaSilo) {
                            distanciaLida = alturaSilo;
                        }

                        let porcentagemLivre = (distanciaLida / alturaSilo) * 100;
                        let porcentagemCheia = 100 - porcentagemLivre;

                        // Att kpi
                        document.getElementById('silo-preenchimento').style.height = `${porcentagemCheia}%`;
                        document.querySelector('.kpi-live h3').innerHTML = `${distanciaLida.toFixed(1)} cm`;
                        document.querySelector('.kpi-live h4').innerHTML = `${Math.round(porcentagemLivre)}% livre`;

                        // Att ultima leitura
                        let dataAtual = new Date();
                        document.querySelector('.kpi-ultima-leitura h4').innerHTML = dataAtual.toLocaleDateString('pt-BR');
                        document.querySelector('.kpi-ultima-leitura p').innerHTML = ultimaLeitura.momento_grafico;
                        let isoData = new Date().toISOString().slice(0, 10);
                        let momentoLeitura = new Date(isoData + 'T' + ultimaLeitura.momento_grafico + 'Z');
                        let segundosAtras = Math.floor((new Date() - momentoLeitura) / 1000);
                        document.querySelector('.kpi-ultima-leitura h3').innerHTML = `${segundosAtras} seg`;

                        attStatuseCronometro(porcentagemLivre);
                    });
                } else {
                    console.log("Houve um erro buscando os dados do silo");
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }


    function attStatuseCronometro(porcentagemLivre) {
        const statusTitulo = document.querySelector('.kpi-status h3');
        const tempoAlertaHtml = document.querySelector('.kpi-tempo-alerta h3');
        const barraSilo = document.getElementById('silo-preenchimento');

        if (porcentagemLivre >= 30 && porcentagemLivre <= 70) {
            statusTitulo.innerHTML = "IDEAL";
            statusTitulo.style.color = "#008000";
            barraSilo.style.backgroundColor = "#008000";
            tempoInicioAlerta = null;
            tempoAlertaHtml.innerHTML = "0D 0h 0m 0s";
        } else {
            if (tempoInicioAlerta == null) tempoInicioAlerta = new Date();

            let diferencaTempo = new Date() - tempoInicioAlerta;
            let dias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            let horas = Math.floor((diferencaTempo % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutos = Math.floor((diferencaTempo % (1000 * 60 * 60)) / 60000);
            let segundos = Math.floor((diferencaTempo % 60000) / 1000);

            tempoAlertaHtml.innerHTML = `${dias}D ${horas}h ${minutos}m ${segundos}s`;

            if (porcentagemLivre < 15 || porcentagemLivre > 85) {
                statusTitulo.innerHTML = "CRÍTICO";
                statusTitulo.style.color = "#cf041f";
                barraSilo.style.backgroundColor = "#cf041f";
            } else {
                statusTitulo.innerHTML = "ATENÇÃO";
                statusTitulo.style.color = "#FFBA00";
                barraSilo.style.backgroundColor = "#FFBA00";
            }
        }
    }

    function mudarSilo(idSiloClicado) {
        idSiloAtual = idSiloClicado;
        attDadosBateria();
        attGraficoseKpis();
    }

    function carregarTodosDadosDashboard() {
        // validarSessao();
        attDadosBateria();
        attGraficoseKpis();

        setInterval(function () {
            attGraficoseKpis();
            attDadosBateria();
        }, 2000);
    }
</script>

</html>
