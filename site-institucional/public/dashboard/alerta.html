<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alertas</title>

    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">

    <link rel="stylesheet" href="../css/alerta.css">
    <link rel="stylesheet" href="../css/menu.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />

    <script src="../js/menu.js"></script>
    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao(), listarUsuario()">

    <div id="menu_hamburger"></div>
    <script>
        fetch("../includes/menu.html")
            .then(resposta => resposta.text())
            .then(dados => {
                document.getElementById("menu_hamburger").innerHTML = dados;
            });
    </script>

    <div class="fundo_geral_tela">
        <div class="div_elementos_gerais">
            <h2 id="titulo_alerta"><span id="titulo_exclamacao">!</span> ALERTAS</h2>


            <div class="cards_elementos_gerais">

                <div class="div_geral_alerta_fazenda" id="id_exibir_alertas">

                    <div class="linha_titulos">
                        <p id="linha_titulo_alerta">ALERTAS</p>
                        <p id="linha_titulo_fazenda">Fazenda</p>
                    </div>

                </div>

                <div class="elementos_qtd_alertas">

                    <div id="titulo_qtd_alerta">
                        <h2>BEM-VINDO!</h2>
                        <span id="span_usuario">Scheffer</span>
                    </div>

                    <div class="div_qtd_alertas">
                        <span>ALERTAS ATUAIS:</span>
                        <div class="cards_geral_qtd_alerta">
                            <div class="card_unico_qtd_alerta cor_font_critico">
                                <h5>CRÍTICOS</h5>
                                <div class="qtd_alerta cor_fundo_alerta_critico" id="id_criticos">
                                    1
                                </div>
                            </div>
                            <div class="card_unico_qtd_alerta cor_font_moderado">
                                <h5>MODERADOS</h5>
                                <div class="qtd_alerta cor_fundo_alerta_moderado" id="id_moderados">
                                    2
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script data-jsd-embedded data-key="72523777-24ce-4b21-b44e-230a68531778" data-base-url="https://jsd-widget.atlassian.com" src="https://jsd-widget.atlassian.com/assets/embed.js"></script>
</body>

<script>
    var id_usuario = sessionStorage.ID_USUARIO;
    var id_empresa = sessionStorage.ID_EMPRESA;
    var nome_usuario = sessionStorage.NOME_USUARIO;

    span_usuario.innerHTML = `${nome_usuario}`;

    async function listarUsuario() {

        const retornoUsuario = await fetch(`../fazenda/listarTipoUsuario/${id_usuario}`);
        const retornoUsuarioConvertido = await retornoUsuario.json();
        const usuario = retornoUsuarioConvertido;

        console.log(usuario);

        if (usuario[0].tipo_usuario === "AdmEmpresa") {
            listarAlertasEmpresa();
        } else {
            listarAlertas();
        }

    }

    async function listarAlertasEmpresa() {

        const retornoAlertasEmpresa = await fetch(`../alerta/listarAlertasEmpresa/${id_empresa}`);
        const retornoAlertasEmpresaConvertido = await retornoAlertasEmpresa.json();
        const alertasE = retornoAlertasEmpresaConvertido;

        console.log(alertasE);

        exibirAlertas(alertasE);
        
    }

    async function listarAlertas() {

        const retornoAlertas = await fetch(`../alerta/listarAlertas/${id_usuario}`);
        const retornoAlertasConvertido = await retornoAlertas.json();
        const alertas = retornoAlertasConvertido;

        console.log(alertas);

        exibirAlertas(alertas);
        
    }

    async function exibirAlertas(alertas) {

        let qtd_criticos = 0;
        let qtd_moderados = 0;
        let mensagem = '';

        for (let i = 0; i < alertas.length; i++) {
            
            if (alertas[i].situacao == 'Crítico') {
                qtd_criticos++
                console.log('ADICIONEI CRITICO: ', qtd_criticos);

                if (alertas[i].prioridade == 1) {
                    mensagem = `
                    O SILO ${alertas[i].num_silo} DA FAZENDA ${alertas[i].fazenda} ALCANÇOU MAIS QUE 85% DE PREENCHIMENTO, ENTRANDO EM ESTADO CRÍTICO. CONFIRA AGORA NA DASHBOARD!
                    `;
                } else {
                    mensagem = `
                    O SILO ${alertas[i].num_silo} DA FAZENDA ${alertas[i].fazenda} ALCANÇOU MENOS QUE 15% DE PREENCHIMENTO, ENTRANDO EM ESTADO CRÍTICO. CONFIRA AGORA NA DASHBOARD!
                    `;
                }

                id_exibir_alertas.innerHTML += `
                
                    <div class="linha_alerta_fazenda">

                        <div class="card_alerta cor_fundo_alerta_critico">
                            <div class="div_info_card_alerta">
                                <div class="div_qtd_exclamacoes">
                                    <span class="exclamacao_pequena">!</span>
                                    <span class="exclamacao_media">!</span>
                                    <span class="exclamacao_grande">!</span>
                                </div>
                                <div class="desc_card_alerta">
                                    <h4>ALERTA CRÍTICO</h4>
                                    <p>O SILO ${alertas[i].num_silo} DA FAZENDA ${alertas[i].fazenda} ALCANÇOU O ESTADO CRÍTICO DE
                                        ARMAZENAMENTO. CONFIRA AGORA NA DASHBOARD!</p>
                                </div>
                            </div>
                            <div class="div_btn_VER_card_alerta">
                                <a href="dashboard-individual.html?id_fazenda=${alertas[i].id_fazenda}&id_bateria=${alertas[i].id_bateria}&id_silo_individual=${alertas[i].id_silo_individual}">VER</a>
                            </div>
                        </div>


                        <div class="card_fazenda cor_border_critico">
                            <p class="titulo_nome_fazenda cor_font_critico">${alertas[i].fazenda}</p>
                            <div class="info_respons_fazenda">
                                <div class="div_nome_responsavel">
                                    <p class="p_bold">Responsável</p>
                                    <p class="p_comum">${alertas[i].responsavel}</p>
                                </div>
                                <div class="div_contato">
                                    <p class="p_bold">Contato</p>
                                    <p class="p_comum">${alertas[i].contato}</p>
                                </div>

                            </div>
                        </div>

                    </div>
                
                `;


            } else if (alertas[i].situacao == 'Moderado') {
                qtd_moderados++
                console.log('ADICIONEI MODERADO: ', qtd_moderados);
                

                if (alertas[i].prioridade == 3) {
                    mensagem = `
                    O SILO ${alertas[i].num_silo} DA FAZENDA ${alertas[i].fazenda} ALCANÇOU MAIS QUE 76% DE PREENCHIMENTO, ENTRANDO EM ESTADO MODERADO. CONFIRA AGORA NA DASHBOARD!
                    `;
                } else {
                    mensagem = `
                    O SILO ${alertas[i].num_silo} DA FAZENDA ${alertas[i].fazenda} ALCANÇOU MENOS QUE 26% DE PREENCHIMENTO, ENTRANDO EM ESTADO MODERADO. CONFIRA AGORA NA DASHBOARD!
                    `;
                }

                id_exibir_alertas.innerHTML += `
                
                    <div class="linha_alerta_fazenda">

                        <div class="card_alerta cor_fundo_alerta_moderado">
                            <div class="div_info_card_alerta">
                                <div class="div_qtd_exclamacoes">
                                    <span class="exclamacao_pequena">!</span>
                                    <span class="exclamacao_media">!</span>

                                </div>
                                <div class="desc_card_alerta">
                                    <h4>ALERTA MODERADO</h4>
                                    <p>O SILO ${alertas[i].num_silo} DA FAZENDA ${alertas[i].fazenda} ALCANÇOU O ESTADO MODERADO DE
                                        ARMAZENAMENTO. CONFIRA AGORA NA DASHBOARD!</p>
                                </div>
                            </div>
                            <div class="div_btn_VER_card_alerta">
                                <a href="dashboard-individual.html?id_fazenda=${alertas[i].id_fazenda}&id_bateria=${alertas[i].id_bateria}&id_silo_individual=${alertas[i].id_silo_individual}">VER</a>
                            </div>
                        </div>


                        <div class="card_fazenda cor_border_moderado">
                            <p class="titulo_nome_fazenda cor_font_moderado">${alertas[i].fazenda}</p>
                            <div class="info_respons_fazenda">
                                <div class="div_nome_responsavel">
                                    <p class="p_bold">Responsável</p>
                                    <p class="p_comum">${alertas[i].responsavel}</p>
                                </div>
                                <div class="div_contato">
                                    <p class="p_bold">Contato</p>
                                    <p class="p_comum">${alertas[i].contato}</p>
                                </div>

                            </div>
                        </div>
                    </div>
                
                `;

            } else {
                alert('#ERRO \nReinicie a Página');
            }

        }

        id_criticos.innerHTML = `${qtd_criticos}`;
        id_moderados.innerHTML = `${qtd_moderados}`;

    }

</script>

</html>
