<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Bateria</title>
    <link rel="stylesheet" href="../css/cadBateria.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="shortcut icon" href="../assets/icon/favicon-dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="../assets/icon/favicon-light.ico" media="(prefers-color-scheme: light)">
    <script src="../js/menu.js"></script>

    <!--Importar validação de sessão-->
    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao()">
    <div class="imgFundo">

        <div class="blur">
            <div class="header"></div>
      
            <div id="menu_hamburger"></div>

            <script>
                fetch("../includes/menu.html")
                    .then(resposta => resposta.text())
                    .then(dados => {
                        document.getElementById("menu_hamburger").innerHTML = dados;
                    });
            </script>
      
            <div class="divTitulo">

                <img class="imgTitulo" src="../assets/imgs/fazenda.png" width="38px">
                <h1 class="titulo">ADICIONAR BATERIA</h1>

            </div>

            <div class="divInfoBateria">

                <div class="boxInfoBateria">

                    <h3 class="tituloInfoBateria">INFORMAÇÕES DA BATERIA</h3>
                    <div class="divInput" id="divIptNome">
                        <label class="labelInput">NOME:</label>
                        <input class="inputGrande" id="iptNome" type="text" placeholder="Ex:XPTO">
                    </div>

                    <!-- <div class="parte2">

                        <div class="divInput" id="divIptQtdSilos">
                            <label class="labelInput">QTD DE SILOS:</label>
                            <input class="inputPequeno" id="iptQtdSilos" type="text" placeholder="Ex:8">
                        </div>

                        <div class="divInput" id="divIptAltura">
                            <label class="labelInput">ALTURA:</label>
                            <input class="inputPequeno" id="iptAltura" type="text" placeholder="Ex:12m">
                        </div>

                        <div class="divInput" id="divIptDiametro">
                            <label class="labelInput">DIÂMETRO:</label>
                            <input class="inputPequeno" id="iptDiametro" type="text" placeholder="Ex:5m">
                        </div>

                    </div> -->

                    <button class="botao" onclick="cadastrarBateria()">ADICIONAR</button>

                </div>

                <div class="cardErro" id="cardErro">
                    <div class="boxErro">
                        <div id="mensagem_erro"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>
</body>

<script>

    var id_fazenda = sessionStorage.ID_FAZENDA_ATUAL;

    function cadastrarBateria() {
    
        var nomeInserido = iptNome.value;

        fetch(`/configBateria/inserirDadosBateria/${id_fazenda}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeBateriaServer: nomeInserido
            }),
        })
        .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
                alert(`Bateria ${nomeInserido} adicionada com sucesso!`);
                cardErro.style.display = "block";
                history.back();
            } else {
                throw "Houve um erro ao tentar realizar o cadastro!";
            }
        })
        .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });

    }

</script>

</html>
